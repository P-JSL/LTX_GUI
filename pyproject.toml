[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-gui"
version = "0.1.0"
description = "Independent desktop job manager for licensed Jasna LTX restoration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "LTX GUI contributors"}]
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
monitoring = ["psutil>=5.9,<8"]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
ltx-gui = "ltx_gui.ui:main"

[tool.setuptools.packages.find]
include = ["ltx_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
